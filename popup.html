<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=360">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <header class="header">
    <img src="rbot.webp" class="logo" alt="RedBot">
    <div>
      <h1>RedBot</h1>
      <p class="subtitle">Reddit Bot Detector</p>
    </div>
  </header>

  <div class="summary">
    <div class="stat">
      <span class="stat-val" id="statTotal">0</span>
      <span class="stat-lbl">Scanned</span>
    </div>
    <div class="stat">
      <span class="stat-val val-red" id="statBots">0</span>
      <span class="stat-lbl">Bots</span>
    </div>
    <div class="stat">
      <span class="stat-val val-yellow" id="statSus">0</span>
      <span class="stat-lbl">Suspicious</span>
    </div>
    <div class="stat">
      <span class="stat-val val-green" id="statHuman">0</span>
      <span class="stat-lbl">Human</span>
    </div>
  </div>

  <section class="section">
    <div class="section-top">
      <h2>Scanned Users</h2>
      <button id="btnScan" class="btn btn-primary">Scan Page</button>
    </div>
    <div id="userList" class="user-list">
      <p class="empty">Open a Reddit thread to start scanning.</p>
    </div>
  </section>

  <section class="section">
    <h2>Settings</h2>
    <label for="apiKey">Gemini API Key</label>
    <div class="row">
      <input type="password" id="apiKey" placeholder="Paste key for Tier 3 analysis">
      <button id="btnSave" class="btn btn-green">Save</button>
    </div>
    <p class="hint">
      Required for deep LLM analysis.
      <a href="https://aistudio.google.com/apikey" target="_blank">Get a free key</a>
    </p>

    <button id="btnClear" class="btn btn-ghost full">Clear Cache</button>
  </section>

  <script src="popup.js"></script>
</body>
</html>
